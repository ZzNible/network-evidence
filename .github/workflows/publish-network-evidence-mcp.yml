name: Publish Network Evidence MCP v0.0.2 to official registry

on:
  push:
    branches:
      - work/ne-mcp-cloudrun-prep-20261008
    paths:
      - .github/workflows/publish-network-evidence-mcp.yml

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'ZzNible/network-evidence' && github.ref == 'refs/heads/work/ne-mcp-cloudrun-prep-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact submitted commit
        uses: actions/checkout@v4

      - name: Validate exact server identity and live endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('server.json').read_text())
          assert x['name']=='io.github.ZzNible/network-evidence'
          assert x['version']=='0.0.2'
          assert x['remotes']==[{'type':'streamable-http','url':'https://network-evidence-mcp-jrkc26rjga-ew.a.run.app/mcp'}]
          print('Manifest identity/scope PASS')
          PY
          curl -fsSL --max-time 25 --retry 2 \
            'https://network-evidence-mcp-jrkc26rjga-ew.a.run.app/health' |
            python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["status"]=="ok" and x["readOnly"] is True and x["liveObservation"] is False and len(x["tools"])==3;print("Public preview health PASS")'

      - name: Install pinned official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 40 --retry 3 -o mcp-publisher_linux_amd64.tar.gz \
            'https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz'
          printf '%s\n' 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher_linux_amd64.tar.gz' | sha256sum -c -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate registry submission (no publish)
        run: ./mcp-publisher validate server.json

      - name: Authenticate via GitHub OIDC (no personal token)
        run: ./mcp-publisher login github-oidc

      - name: Publish v0.0.2 to official MCP Registry
        run: ./mcp-publisher publish server.json
